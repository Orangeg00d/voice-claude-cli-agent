[project]
name = "voice-claude-agent"
version = "0.1.0"
description = "macOS voice-activated Claude CLI agent"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "sounddevice>=0.4",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
voice-claude-agent = "voice_claude_agent.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
